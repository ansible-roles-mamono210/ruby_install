---
- name: Fixed controller to disposable target runtime checks
  hosts: target
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_pipelining: true
    ansible_remote_tmp: "/tmp/ruby-p1-ansible-{{ ansible_user }}"
    ansible_docker_privileged: false
    ansible_docker_docker_host: unix:///var/run/docker.sock
    ansible_docker_timeout: 20
  tasks:
    - name: P1 limited facts
      ansible.builtin.setup:
        gather_subset: ['!all', '!min', distribution, platform, user]
        filter:
          - ansible_distribution
          - ansible_distribution_major_version
          - ansible_python_version
          - ansible_user_uid
        gather_timeout: 10
      no_log: true
      register: p1_facts

    - name: P1 validate facts
      ansible.builtin.assert:
        that:
          - p1_facts.ansible_facts.ansible_distribution == 'CentOS'
          - p1_facts.ansible_facts.ansible_distribution_major_version == '9'
          - p1_facts.ansible_facts.ansible_python_version == '3.9.19'
          - p1_facts.ansible_facts.ansible_user_uid == 0
        quiet: true
      no_log: true

    - name: P1 stock baseline
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', '/p1/runtime_target.py') }}"
          - baseline
      changed_when: false
      register: p1_baseline
      no_log: true

    - name: P1 create disposable fixture
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', '/p1/runtime_target.py') }}"
          - fixture
      changed_when: true
      register: p1_fixture
      no_log: true

    - name: P1 nonroot identity
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -B, -c, 'import os; print(os.geteuid())']
      vars:
        ansible_user: ruby_p1_probe
      become: false
      changed_when: false
      register: p1_nonroot
      no_log: true

    - name: P1 become identity
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -B, -c, 'import os; print(os.geteuid())']
      vars:
        ansible_user: ruby_p1_probe
      become: true
      become_method: ansible.builtin.sudo
      become_user: root
      become_flags: -H -S -n
      changed_when: false
      register: p1_become
      no_log: true

    # Keep original results private. Only the enumerated measurement fields
    # enter the stdout callback; it validates them before emitting any values.
    - name: P1 publish bounded measurements
      ansible.builtin.debug:
        msg:
          schema: ruby-p1-runtime-publication-r16
          facts:
            ansible_distribution: "{{ p1_facts.ansible_facts.ansible_distribution }}"
            ansible_distribution_major_version: "{{ p1_facts.ansible_facts.ansible_distribution_major_version }}"
            ansible_python_version: "{{ p1_facts.ansible_facts.ansible_python_version }}"
            ansible_user_uid: "{{ p1_facts.ansible_facts.ansible_user_uid }}"
          commands:
            P1 stock baseline:
              rc: "{{ p1_baseline.rc }}"
              stdout: "{{ p1_baseline.stdout }}"
              stderr_present: "{{ p1_baseline.stderr != '' }}"
            P1 create disposable fixture:
              rc: "{{ p1_fixture.rc }}"
              stdout: "{{ p1_fixture.stdout }}"
              stderr_present: "{{ p1_fixture.stderr != '' }}"
            P1 nonroot identity:
              rc: "{{ p1_nonroot.rc }}"
              stdout: "{{ p1_nonroot.stdout }}"
              stderr_present: "{{ p1_nonroot.stderr != '' }}"
            P1 become identity:
              rc: "{{ p1_become.rc }}"
              stdout: "{{ p1_become.stdout }}"
              stderr_present: "{{ p1_become.stderr != '' }}"
      no_log: false
