---
version: 2.1

orbs:
  ansible-lint: orbss/ansible-lint@0.0.3
  trailing-whitespace: orbss/trailing-whitespace@0.0.2
  yamllint: orbss/yamllint@0.0.4

parameters:
  run_v010_release_checks:
    type: boolean
    default: false

  run_p1_build_probe:
    type: boolean
    default: false

  run_p1_env_probe:
    type: boolean
    default: false

  ansible_lint_executor_image:
    type: string
    default: ghcr.io/docker-images-mamono210/circleci-executors/ansible-lint:26.1.1-py3.14
  ansible_lint_executor_resource_class:
    type: enum
    enum: [small, medium, medium+, large]
    default: small
  molecule_docker_executor_image:
    type: string
    default: ghcr.io/docker-images-mamono210/circleci-executors/molecule-docker:26.2.0-py3.14-ans13.4.0
  molecule_machine_executor_image:
    type: string
    default: ubuntu-2204:2023.10.1
  molecule_machine_executor_resource_class:
    type: enum
    enum: [medium, large, xlarge]
    default: medium
  trailing_whitespace_executor_image:
    type: string
    default: ghcr.io/docker-images-mamono210/circleci-executors/trailing-whitespace:py3.14-20260210
  trailing_whitespace_executor_resource_class:
    type: enum
    enum: [small, medium, medium+, large]
    default: small
  yamllint_executor_image:
    type: string
    default: ghcr.io/docker-images-mamono210/circleci-executors/yamllint:1.38.0-py3.14
  yamllint_executor_resource_class:
    type: enum
    enum: [small, medium, medium+, large]
    default: small

commands:
  v010-checks:
    steps:
      - checkout
      - run:
          name: Validate v0.1.0 candidate in the fixed environment
          shell: /bin/bash -eo pipefail
          no_output_timeout: 11m
          command: |
            set -euo pipefail
            umask 077
            command -v timeout >/dev/null
            command -v git >/dev/null
            mkdir -p v010-evidence
            v010_tmp=$(mktemp -d)
            export TMPDIR="$v010_tmp"
            export PYTHONDONTWRITEBYTECODE=1
            cleanup() {
              rm -rf -- "$v010_tmp"
              if test ! -e "$v010_tmp"; then
                printf '%s\n' '{"fixture_directory_removed":true}' > v010-evidence/cleanup.json
              else
                printf '%s\n' '{"fixture_directory_removed":false}' > v010-evidence/cleanup.json
                return 1
              fi
            }
            trap cleanup EXIT
            set +e
            timeout --signal=TERM --kill-after=30s 10m python3 - <<'V010_PY'
            """Embedded v0.1.0 candidate check; installed into the CI command at preparation."""
            import hashlib
            from importlib import metadata
            import json
            import os
            from pathlib import Path
            import platform
            import re
            import subprocess
            import sys
            import tempfile
            import unittest

            import yaml

            BASE = "55a7ebfa6c6358ea03563d9ab6741921b2be03dc"
            REPOSITORY = "https://github.com/ansible-roles-mamono210/ruby_install.git"
            DISTRIBUTION = {
                "README.md", "meta/main.yml", "LICENSE", "CHANGELOG.md",
                "docs/releases/v0.1.0.md", "docs/p1-evidence.md", ".circleci/config.yml",
            }
            TEST_HASHES = {'tests/test_dependency_probe.py': '7716459d9b4457329a74184a53ff3c2dfc084a81aff490a69524f4c21511aa94', 'tests/test_runtime_smoke.py': 'c078ae16ae857c26b75e08467e1d6fc0c757cc68a8f3b176c1137f13b07833db', 'tests/test_build_probe.py': 'cf44b31681ddfb3f3c62fb7494ab3298d8700586cf8ee55358edcf6293d52da8'}
            ALLOWED = DISTRIBUTION | set(TEST_HASHES)
            LINT_IDS = {
                "test_lint_probe.RealLint.test_live_eight_controls",
                "test_lint_probe.RealLint.test_disabling_the_rule_is_detected",
                "test_role_variable_names.RealControls.test_real_source_and_eight_controls_with_host_validation",
                "test_role_variable_names.RealControls.test_disabling_rule_is_detected",
                "test_role_variable_names.RealControls.test_unknown_stderr_and_zero_processed_are_rejected",
                "test_role_variable_names.RealControls.test_source_change_after_lint_is_rejected",
            }
            OUT = Path("v010-evidence")
            OUT.mkdir(exist_ok=True)
            MODE = os.environ["V010_CHECK_MODE"]
            REPORT = {"mode": MODE, "status": "started", "release_ready": False}


            def require(condition, reason):
                if not condition:
                    raise RuntimeError(reason)


            def git(*args, cwd=None):
                return subprocess.check_output(["git", *args], cwd=cwd).decode().strip()


            def flatten(suite):
                for item in suite:
                    if isinstance(item, unittest.TestSuite):
                        yield from flatten(item)
                    else:
                        yield item.id()


            class Result(unittest.TextTestResult):
                def __init__(self, *args, **kwargs):
                    super().__init__(*args, **kwargs)
                    self.started_ids = []
                    self.success_ids = []

                def startTest(self, test):
                    self.started_ids.append(test.id())
                    super().startTest(test)

                def addSuccess(self, test):
                    self.success_ids.append(test.id())
                    super().addSuccess(test)


            def main():
                require(MODE in {"controller", "lint"}, "unknown check mode")
                expected = ("3.14.10", "2.21.6") if MODE == "controller" else ("3.14.3", "2.20.3")
                actual = (platform.python_version(), metadata.version("ansible-core"))
                REPORT["environment"] = {
                    "python": actual[0], "ansible_core": actual[1],
                    "configured_image": os.environ["V010_IMAGE"],
                    "architecture": platform.machine(),
                }
                require(actual == expected, "fixed Python/core version mismatch")
                require(platform.machine() == "x86_64", "unexpected architecture")
                if MODE == "lint":
                    lint = metadata.version("ansible-lint")
                    REPORT["environment"]["ansible_lint"] = lint
                    require(lint == "26.1.1", "fixed lint version mismatch")

                sha = os.environ["CIRCLE_SHA1"]
                require(re.fullmatch(r"[0-9a-f]{40}", sha) is not None, "invalid candidate SHA")
                require(git("rev-parse", "HEAD") == sha, "checkout SHA mismatch")
                subprocess.run(["git", "merge-base", "--is-ancestor", BASE, sha], check=True)
                require(not git("diff", "--name-only", "HEAD"), "modified tracked checkout")
                changed = git("diff", "--name-status", "--no-renames", BASE, sha).splitlines()
                for change in changed:
                    status, path = change.split("\t")
                    require(status in {"A", "M"} and path in ALLOWED, "unplanned source change")
                REPORT.update(candidate_sha=sha, base_sha=BASE, changed=changed)
                for path, expected_hash in TEST_HASHES.items():
                    require(hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected_hash,
                            "workflow regression test hash mismatch")
                paths = git("ls-tree", "-r", "--name-only", sha).splitlines()
                hashes = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
                (OUT / "candidate-sha256.json").write_text(json.dumps(hashes, indent=2) + "\n")
                REPORT["source_guard"] = "seven distribution paths plus three hash-pinned workflow tests"

                loader = unittest.TestLoader()
                if MODE == "controller":
                    suite = loader.discover("tests", pattern="test_*.py")
                else:
                    suite = unittest.TestSuite([
                        loader.discover("tests", pattern="test_lint_probe.py"),
                        loader.discover("tests", pattern="test_role_variable_names.py"),
                    ])
                ids = list(flatten(suite))
                expected_count = 582 if MODE == "controller" else 20
                require(len(ids) == len(set(ids)) == expected_count, "unexpected collected test IDs")
                require(LINT_IDS <= set(ids), "required lint test IDs not collected")
                with (OUT / "unittest.log").open("w") as stream:
                    result = unittest.TextTestRunner(stream=stream, verbosity=2, resultclass=Result).run(suite)
                skipped = [{"id": t.id(), "reason": why} for t, why in result.skipped]
                REPORT["tests"] = {
                    "collected": ids, "started": result.started_ids, "passed": result.success_ids,
                    "run": result.testsRun, "skipped": skipped,
                    "failures": len(result.failures), "errors": len(result.errors),
                    "expected_failures": len(result.expectedFailures),
                    "unexpected_successes": len(result.unexpectedSuccesses),
                }
                require(result.wasSuccessful() and not result.expectedFailures, "regression failed")
                require(set(result.started_ids) == set(ids), "not every collected test started")
                skipped_ids = {x["id"] for x in skipped}
                require(skipped_ids <= (LINT_IDS if MODE == "controller" else set()), "unexpected skip")
                if MODE == "lint":
                    require(LINT_IDS <= set(result.success_ids), "lint controls did not pass")
                REPORT["lint_complement_required"] = sorted(skipped_ids)

                if MODE == "controller":
                    for path in DISTRIBUTION:
                        require(Path(path).is_file(), "distribution file missing: " + path)
                        data = Path(path).read_bytes()
                        require(data.endswith(b"\n") and b"\r" not in data, "non-LF file: " + path)
                        require(all(line == line.rstrip(b" \t") for line in data.splitlines()),
                                "trailing whitespace: " + path)
                    meta = yaml.safe_load(Path("meta/main.yml").read_text())["galaxy_info"]
                    yaml.safe_load(Path(".circleci/config.yml").read_text())
                    require(meta["license"] == "BSD-3-Clause", "license metadata not finalized")
                    require("min_ansible_version" not in meta and "platforms" not in meta,
                            "unverified support declaration")
                    for path in ("README.md", "CHANGELOG.md", "docs/releases/v0.1.0.md"):
                        require("v0.1.0" in Path(path).read_text(), "release version missing")
                    REPORT["license"] = "file and identifier checked; ownership/provenance require human confirmation"

                    with tempfile.TemporaryDirectory(prefix="v010-fetch-") as directory:
                        git("init", "--quiet", directory)
                        git("fetch", "--quiet", "--depth=1", REPOSITORY, sha, cwd=directory)
                        git("checkout", "--quiet", "--detach", "FETCH_HEAD", cwd=directory)
                        require(git("rev-parse", "HEAD", cwd=directory) == sha, "retrieval SHA mismatch")
                        require(git("ls-tree", "-r", "--name-only", sha, cwd=directory).splitlines() == paths,
                                "retrieval file list mismatch")
                        retrieved = {p: hashlib.sha256((Path(directory) / p).read_bytes()).hexdigest() for p in paths}
                        require(retrieved == hashes, "retrieved bytes differ")
                    REPORT["retrieval"] = {"commit": sha, "files": len(paths), "matched": True}
                require(not git("diff", "--name-only", "HEAD"), "tests changed tracked checkout")
                REPORT["status"] = "limited_checks_passed"
                REPORT["release_ready"] = False
                REPORT["remaining"] = "human document/license review, both jobs and trigger/cleanup review, then publication authorization"


            try:
                main()
            except Exception as exc:
                REPORT["status"] = "failed"
                REPORT["error_type"] = type(exc).__name__
                # Full unittest diagnostics go to a job artifact; environment/credentials are not dumped.
                print("v0.1.0 check failed:", type(exc).__name__, file=sys.stderr)
                raise
            finally:
                (OUT / "result.json").write_text(json.dumps(REPORT, indent=2) + "\n")
                print(json.dumps({"mode": MODE, "status": REPORT["status"], "release_ready": False}))
            V010_PY
            v010_rc=$?
            set -e
            printf '%s\n' "$v010_rc" > v010-evidence/exit-code.txt
            exit "$v010_rc"
      - store_artifacts:
          path: v010-evidence
          destination: v010-evidence

jobs:
  v010-static-and-probes:
    docker:
      - image: ghcr.io/docker-images-mamono210/circleci-executors/molecule-docker@sha256:a80f2c478e9e183cdd782f8cdff79d1025cdc5291190e360898738fd8e6f7f41
    resource_class: small
    environment:
      V010_CHECK_MODE: controller
      V010_IMAGE: ghcr.io/docker-images-mamono210/circleci-executors/molecule-docker@sha256:a80f2c478e9e183cdd782f8cdff79d1025cdc5291190e360898738fd8e6f7f41
    steps:
      - v010-checks

  v010-lint-controls:
    docker:
      - image: ghcr.io/docker-images-mamono210/circleci-executors/ansible-lint@sha256:4ea7fe7ebbe7fd06bd5a7fc61b8931c3303a11c9bd4eb06431a810f5914b8718
    resource_class: small
    environment:
      V010_CHECK_MODE: lint
      V010_IMAGE: ghcr.io/docker-images-mamono210/circleci-executors/ansible-lint@sha256:4ea7fe7ebbe7fd06bd5a7fc61b8931c3303a11c9bd4eb06431a810f5914b8718
    steps:
      - v010-checks

  p1-ruby-build:
    machine:
      image: ubuntu-2204:2023.10.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Diagnose phase memory for Ruby 3.4.12 with docs and Rust present
          no_output_timeout: 16m
          command: |
            set -euo pipefail
            umask 077
            mkdir -p p1-evidence
            set +e
            timeout --signal=TERM --kill-after=60s 15m \
              python3 scripts/p1/build_probe.py \
              --allow-pull --ephemeral-ci --allow-install --allow-rust-install --allow-ci430-replacements \
              --allow-ruby-3412-rust-build --allow-memory-diagnostic --output p1-evidence/environment.json
            p1_probe_rc=$?
            set -e
            printf '%s\n' "$p1_probe_rc" > p1-evidence/exit-code.txt
            exit "$p1_probe_rc"
      - store_artifacts:
          path: p1-evidence
          destination: p1-ruby-build

  p1-environment:
    machine:
      image: ubuntu-2204:2023.10.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify actual Ansible acquisition with fixed controller and target
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            umask 077
            mkdir -p p1-evidence
            set +e
            timeout --signal=TERM --kill-after=60s 11m \
              python3 scripts/p1/ansible_download_probe.py \
              --allow-pull --ephemeral-ci --allow-ci-docker-api --allow-ansible-download \
              --output p1-evidence/environment.json
            p1_probe_rc=$?
            set -e
            printf '%s\n' "$p1_probe_rc" > p1-evidence/exit-code.txt
            exit "$p1_probe_rc"
      - store_artifacts:
          path: p1-evidence
          destination: p1-environment

  ansible-lint:
    executor:
      name: ansible-lint/default
      image: << pipeline.parameters.ansible_lint_executor_image >>
      resource_class: << pipeline.parameters.ansible_lint_executor_resource_class >>
    steps:
      - checkout
      - ansible-lint/execute:
          molecule-role-test: true
  molecule:
    machine:
      image: << pipeline.parameters.molecule_machine_executor_image >>
      resource_class: << pipeline.parameters.molecule_machine_executor_resource_class >>
    parameters:
      checkout-path:
        type: string
      molecule-docker-executor-image:
        type: string
      molecule-scenario-name:
        type: string
      molecule-test-image:
        type: string
    steps:
      - checkout:
          path: << parameters.checkout-path >>
      - run:
          name: Test with Molecule
          command: |
            sudo chmod 666 /var/run/docker.sock

            cd << parameters.checkout-path >>

            docker run --rm -it \
            -e ANSIBLE_FORCE_COLOR=1 \
            -e MOLECULE_IMAGE=<< parameters.molecule-test-image >> \
            -v "$(pwd)":/tmp/$(basename "${PWD}"):ro \
            -v /usr/bin/docker:/usr/bin/docker \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /tmp/$(basename "${PWD}") \
            << parameters.molecule-docker-executor-image >> \
            molecule test --scenario-name << parameters.molecule-scenario-name >>
      - run:
          name: Show Ansible version
          command: |
            docker run --rm -it \
            << parameters.molecule-docker-executor-image >> \
            ansible --version \
            | GREP_COLORS='mt=01;34' egrep --color=always '[[:digit:]]' \
            | GREP_COLORS='mt=01;34' egrep --color=always '\.' \
            | GREP_COLORS='mt=01;33' egrep --color=always 'ansible.* '
      - run:
          name: Show Molecule version
          command: |
            docker run --rm -it \
            << parameters.molecule-docker-executor-image >> \
            molecule --version
  trailing-whitespace:
    executor:
      name: trailing-whitespace/default
      image: << pipeline.parameters.trailing_whitespace_executor_image >>
      resource_class: << pipeline.parameters.trailing_whitespace_executor_resource_class >>
    steps:
      - checkout
      - trailing-whitespace/execute
  yamllint:
    executor:
      name: yamllint/default
      image: << pipeline.parameters.yamllint_executor_image >>
      resource_class: << pipeline.parameters.yamllint_executor_resource_class >>
    steps:
      - checkout
      - yamllint/execute

workflows:
  version: 2.1
  p1-ruby-build-measurement:
    when:
      and:
        - not: << pipeline.parameters.run_v010_release_checks >>
        - << pipeline.parameters.run_p1_build_probe >>
        - not: << pipeline.parameters.run_p1_env_probe >>
        - equal: [plan/ruby-100-p1-env-r1, << pipeline.git.branch >>]
    jobs:
      - p1-ruby-build
  p1-environment-measurement:
    when:
      and:
        - not: << pipeline.parameters.run_v010_release_checks >>
        - << pipeline.parameters.run_p1_env_probe >>
        - not: << pipeline.parameters.run_p1_build_probe >>
        - equal: [plan/ruby-100-p1-env-r1, << pipeline.git.branch >>]
    jobs:
      - p1-environment
  build:
    when:
      and:
        - not: << pipeline.parameters.run_v010_release_checks >>
        - not: << pipeline.parameters.run_p1_build_probe >>
        - not: << pipeline.parameters.run_p1_env_probe >>
        - not:
            equal: [plan/ruby-100-p1-env-r1, << pipeline.git.branch >>]
    jobs:
      - trailing-whitespace
      - yamllint:
          requires:
            - trailing-whitespace
      - ansible-lint:
          requires:
            - yamllint
      - molecule:
          matrix:
            parameters:
              checkout-path:
                - 'ruby_install'
              molecule-docker-executor-image:
                - '<< pipeline.parameters.molecule_docker_executor_image >>'
              molecule-scenario-name:
                - 'default'
              molecule-test-image:
                - 'ghcr.io/docker-images-mamono210/ansible-test/centos-stream9:latest'
          requires:
            - ansible-lint
  v010-release-checks:
    when:
      and:
        - << pipeline.parameters.run_v010_release_checks >>
        - not: << pipeline.parameters.run_p1_build_probe >>
        - not: << pipeline.parameters.run_p1_env_probe >>
        - equal: [plan/ruby-100-p1-env-r1, << pipeline.git.branch >>]
    jobs:
      - v010-static-and-probes:
          filters:
            tags:
              ignore: /.*/
      - v010-lint-controls:
          filters:
            tags:
              ignore: /.*/
