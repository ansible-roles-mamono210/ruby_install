---
version: 2.1

orbs:
  ansible-lint: orbss/ansible-lint@0.0.3
  trailing-whitespace: orbss/trailing-whitespace@0.0.2
  yamllint: orbss/yamllint@0.0.4

parameters:
  run_v010_release_checks:
    type: boolean
    default: false

  run_p1_build_probe:
    type: boolean
    default: false

  run_p1_env_probe:
    type: boolean
    default: false

  ansible_lint_executor_image:
    type: string
    default: ghcr.io/docker-images-mamono210/circleci-executors/ansible-lint:26.1.1-py3.14
  ansible_lint_executor_resource_class:
    type: enum
    enum: [small, medium, medium+, large]
    default: small
  molecule_docker_executor_image:
    type: string
    default: ghcr.io/docker-images-mamono210/circleci-executors/molecule-docker:26.2.0-py3.14-ans13.4.0
  molecule_machine_executor_image:
    type: string
    default: ubuntu-2204:2023.10.1
  molecule_machine_executor_resource_class:
    type: enum
    enum: [medium, large, xlarge]
    default: medium
  trailing_whitespace_executor_image:
    type: string
    default: ghcr.io/docker-images-mamono210/circleci-executors/trailing-whitespace:py3.14-20260210
  trailing_whitespace_executor_resource_class:
    type: enum
    enum: [small, medium, medium+, large]
    default: small
  yamllint_executor_image:
    type: string
    default: ghcr.io/docker-images-mamono210/circleci-executors/yamllint:1.38.0-py3.14
  yamllint_executor_resource_class:
    type: enum
    enum: [small, medium, medium+, large]
    default: small

commands:
  v010-checks:
    steps:
      - checkout
      - run:
          name: Validate v0.1.0 candidate in the fixed environment
          shell: /bin/bash -eo pipefail
          no_output_timeout: 11m
          command: |
            set -euo pipefail
            umask 077
            command -v timeout >/dev/null
            command -v git >/dev/null
            mkdir -p v010-evidence
            v010_tmp=$(mktemp -d)
            export TMPDIR="$v010_tmp"
            export PYTHONDONTWRITEBYTECODE=1
            cleanup() {
              rm -rf -- "$v010_tmp"
              if test ! -e "$v010_tmp"; then
                printf '%s\n' '{"fixture_directory_removed":true}' > v010-evidence/cleanup.json
              else
                printf '%s\n' '{"fixture_directory_removed":false}' > v010-evidence/cleanup.json
                return 1
              fi
            }
            trap cleanup EXIT
            set +e
            timeout --signal=TERM --kill-after=30s 10m python3 scripts/release/check_v010.py
            v010_rc=$?
            set -e
            printf '%s\n' "$v010_rc" > v010-evidence/exit-code.txt
            exit "$v010_rc"
      - store_artifacts:
          path: v010-evidence
          destination: v010-evidence

jobs:
  v010-static-and-probes:
    docker:
      - image: ghcr.io/docker-images-mamono210/circleci-executors/molecule-docker@sha256:a80f2c478e9e183cdd782f8cdff79d1025cdc5291190e360898738fd8e6f7f41
    resource_class: small
    environment:
      V010_CHECK_MODE: controller
      V010_IMAGE: ghcr.io/docker-images-mamono210/circleci-executors/molecule-docker@sha256:a80f2c478e9e183cdd782f8cdff79d1025cdc5291190e360898738fd8e6f7f41
    steps:
      - v010-checks

  v010-lint-controls:
    docker:
      - image: ghcr.io/docker-images-mamono210/circleci-executors/ansible-lint@sha256:4ea7fe7ebbe7fd06bd5a7fc61b8931c3303a11c9bd4eb06431a810f5914b8718
    resource_class: small
    environment:
      V010_CHECK_MODE: lint
      V010_IMAGE: ghcr.io/docker-images-mamono210/circleci-executors/ansible-lint@sha256:4ea7fe7ebbe7fd06bd5a7fc61b8931c3303a11c9bd4eb06431a810f5914b8718
    steps:
      - v010-checks

  p1-ruby-build:
    machine:
      image: ubuntu-2204:2023.10.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Diagnose phase memory for Ruby 3.4.12 with docs and Rust present
          no_output_timeout: 16m
          command: |
            set -euo pipefail
            umask 077
            mkdir -p p1-evidence
            set +e
            timeout --signal=TERM --kill-after=60s 15m \
              python3 scripts/p1/build_probe.py \
              --allow-pull --ephemeral-ci --allow-install --allow-rust-install --allow-ci430-replacements \
              --allow-ruby-3412-rust-build --allow-memory-diagnostic --output p1-evidence/environment.json
            p1_probe_rc=$?
            set -e
            printf '%s\n' "$p1_probe_rc" > p1-evidence/exit-code.txt
            exit "$p1_probe_rc"
      - store_artifacts:
          path: p1-evidence
          destination: p1-ruby-build

  p1-environment:
    machine:
      image: ubuntu-2204:2023.10.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify actual Ansible acquisition with fixed controller and target
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            umask 077
            mkdir -p p1-evidence
            set +e
            timeout --signal=TERM --kill-after=60s 11m \
              python3 scripts/p1/ansible_download_probe.py \
              --allow-pull --ephemeral-ci --allow-ci-docker-api --allow-ansible-download \
              --output p1-evidence/environment.json
            p1_probe_rc=$?
            set -e
            printf '%s\n' "$p1_probe_rc" > p1-evidence/exit-code.txt
            exit "$p1_probe_rc"
      - store_artifacts:
          path: p1-evidence
          destination: p1-environment

  ansible-lint:
    executor:
      name: ansible-lint/default
      image: << pipeline.parameters.ansible_lint_executor_image >>
      resource_class: << pipeline.parameters.ansible_lint_executor_resource_class >>
    steps:
      - checkout
      - ansible-lint/execute:
          molecule-role-test: true
  molecule:
    machine:
      image: << pipeline.parameters.molecule_machine_executor_image >>
      resource_class: << pipeline.parameters.molecule_machine_executor_resource_class >>
    parameters:
      checkout-path:
        type: string
      molecule-docker-executor-image:
        type: string
      molecule-scenario-name:
        type: string
      molecule-test-image:
        type: string
    steps:
      - checkout:
          path: << parameters.checkout-path >>
      - when:
          condition:
            equal: [preflight, << parameters.molecule-scenario-name >>]
          steps:
            - run:
                name: Test target state and controller-only entry cases
                command: |
                  set -eu
                  cd << parameters.checkout-path >>
                  docker run --rm --entrypoint /usr/bin/python3 \
                    -v "$PWD":/role:ro -w /role << parameters.molecule-test-image >> \
                    -B -m unittest discover -s tests -p test_role_preflight.py
                  docker run --rm --entrypoint python3 \
                    -v "$PWD":/tmp/ruby_install:ro -w /tmp/ruby_install << parameters.molecule-docker-executor-image >> \
                    -B tests/preflight/run.py
      - run:
          name: Test with Molecule
          command: |
            sudo chmod 666 /var/run/docker.sock

            cd << parameters.checkout-path >>

            docker run --rm -it \
            -e ANSIBLE_FORCE_COLOR=1 \
            -e MOLECULE_IMAGE=<< parameters.molecule-test-image >> \
            -v "$(pwd)":/tmp/$(basename "${PWD}"):ro \
            -v /usr/bin/docker:/usr/bin/docker \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /tmp/$(basename "${PWD}") \
            << parameters.molecule-docker-executor-image >> \
            molecule test --scenario-name << parameters.molecule-scenario-name >>
      - run:
          name: Show Ansible version
          command: |
            docker run --rm -it \
            << parameters.molecule-docker-executor-image >> \
            ansible --version \
            | GREP_COLORS='mt=01;34' egrep --color=always '[[:digit:]]' \
            | GREP_COLORS='mt=01;34' egrep --color=always '\.' \
            | GREP_COLORS='mt=01;33' egrep --color=always 'ansible.* '
      - run:
          name: Show Molecule version
          command: |
            docker run --rm -it \
            << parameters.molecule-docker-executor-image >> \
            molecule --version
  trailing-whitespace:
    executor:
      name: trailing-whitespace/default
      image: << pipeline.parameters.trailing_whitespace_executor_image >>
      resource_class: << pipeline.parameters.trailing_whitespace_executor_resource_class >>
    steps:
      - checkout
      - trailing-whitespace/execute
  yamllint:
    executor:
      name: yamllint/default
      image: << pipeline.parameters.yamllint_executor_image >>
      resource_class: << pipeline.parameters.yamllint_executor_resource_class >>
    steps:
      - checkout
      - yamllint/execute

workflows:
  version: 2.1
  p1-ruby-build-measurement:
    when:
      and:
        - not: << pipeline.parameters.run_v010_release_checks >>
        - << pipeline.parameters.run_p1_build_probe >>
        - not: << pipeline.parameters.run_p1_env_probe >>
        - equal: [plan/ruby-100-p1-env-r1, << pipeline.git.branch >>]
    jobs:
      - p1-ruby-build
  p1-environment-measurement:
    when:
      and:
        - not: << pipeline.parameters.run_v010_release_checks >>
        - << pipeline.parameters.run_p1_env_probe >>
        - not: << pipeline.parameters.run_p1_build_probe >>
        - equal: [plan/ruby-100-p1-env-r1, << pipeline.git.branch >>]
    jobs:
      - p1-environment
  build:
    when:
      and:
        - not: << pipeline.parameters.run_v010_release_checks >>
        - not: << pipeline.parameters.run_p1_build_probe >>
        - not: << pipeline.parameters.run_p1_env_probe >>
        - not:
            equal: [plan/ruby-100-p1-env-r1, << pipeline.git.branch >>]
    jobs:
      - trailing-whitespace
      - yamllint:
          requires:
            - trailing-whitespace
      - ansible-lint:
          requires:
            - yamllint
      - molecule:
          name: preflight
          checkout-path: ruby_install
          molecule-docker-executor-image: ghcr.io/docker-images-mamono210/circleci-executors/molecule-docker@sha256:a80f2c478e9e183cdd782f8cdff79d1025cdc5291190e360898738fd8e6f7f41
          molecule-scenario-name: preflight
          molecule-test-image: ghcr.io/docker-images-mamono210/ansible-test/centos-stream9@sha256:96fbd1eac7c972466192da5183e80deeacd226332265d1698b2581bf7666ccd2
          requires:
            - ansible-lint
          filters:
            branches:
              only: feature/v0.2.0-install
      - molecule:
          matrix:
            parameters:
              checkout-path:
                - 'ruby_install'
              molecule-docker-executor-image:
                - '<< pipeline.parameters.molecule_docker_executor_image >>'
              molecule-scenario-name:
                - 'default'
              molecule-test-image:
                - 'ghcr.io/docker-images-mamono210/ansible-test/centos-stream9:latest'
          requires:
            - ansible-lint
  v010-release-checks:
    when:
      and:
        - << pipeline.parameters.run_v010_release_checks >>
        - not: << pipeline.parameters.run_p1_build_probe >>
        - not: << pipeline.parameters.run_p1_env_probe >>
        - equal: [plan/ruby-100-p1-env-r1, << pipeline.git.branch >>]
    jobs:
      - v010-static-and-probes:
          filters:
            tags:
              ignore: /.*/
      - v010-lint-controls:
          filters:
            tags:
              ignore: /.*/
