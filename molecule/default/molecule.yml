---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ruby-install-default
    image: ${MOLECULE_IMAGE}
    pre_build_image: true
    cpus: 1
    memory: 2G
    memory_swap: 2G
provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      roles_path: "$HOME/.ansible/roles/:/tmp"
verifier:
  name: ansible
scenario:
  test_sequence:
    - syntax
    - create
    - converge
    - side_effect
    - check
    - idempotence
    - verify
    - destroy
