---
- name: Save the target state after the first successful installation
  hosts: all
  gather_facts: false
  become: true
  vars_files: [vars/main.yml]
  tasks:
    - name: Read the prefix, public commands, RPMs and repository settings
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../shared/snapshot.py {{ ruby_install_test_prefix }}"
        executable: /usr/bin/python3
      register: ruby_install_baseline
      changed_when: false

    - name: Store the protected state for verification after reruns
      ansible.builtin.copy:
        dest: /var/tmp/ruby-install-default-baseline.json
        content: "{{ ruby_install_baseline.stdout | from_json | to_json }}\n"
        mode: "0600"
