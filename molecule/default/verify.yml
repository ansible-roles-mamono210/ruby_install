---
- name: Verify the Role-generated record and unchanged installation
  hosts: all
  gather_facts: true
  become: true
  vars_files: [vars/main.yml]
  tasks:
    - name: Read the completed installation record
      ansible.builtin.slurp:
        src: "{{ ruby_install_test_prefix }}/.ruby-install-state.json"
      register: ruby_install_record

    - name: Exercise the installed commands, libraries, JIT and standard documentation
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/files/check_case.py ruby {{ ruby_install_test_version }}
          {{ ruby_install_test_prefix }} {{ ruby_install_test_profile }}
        executable: /usr/bin/python3
      register: ruby_install_test_runtime
      changed_when: false

    - name: Read the Rust observation from before installation
      ansible.builtin.slurp:
        src: /var/tmp/ruby-install-rust-before.json
      register: ruby_install_test_rust_before

    - name: Compare the OS Ruby with its pre-installation snapshot
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/files/check_os_ruby.py verify"
        executable: /usr/bin/python3
      register: ruby_install_test_os_ruby
      changed_when: false
      when: ruby_install_test_os_ruby_case

    - name: Verify the actual Rust environment after the Role
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/files/check_case.py rust {{ ruby_install_test_profile }}"
        executable: /usr/bin/python3
      register: ruby_install_test_rust_after
      changed_when: false

    - name: Read the snapshot from the first installation
      ansible.builtin.slurp:
        src: /var/tmp/ruby-install-default-baseline.json
      register: ruby_install_before

    - name: Read the target state after check mode and idempotence
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../shared/snapshot.py {{ ruby_install_test_prefix }}"
        executable: /usr/bin/python3
      register: ruby_install_after
      changed_when: false

    - name: Look for retained workspaces on the disposable target
      ansible.builtin.find:
        paths: /tmp
        file_type: directory
        patterns: ruby-install-*
      register: ruby_install_workspaces

    - name: Require the requested contract and identical protected state
      vars:
        ruby_install_expected_record:
          schema_version: 1
          state: complete
          ruby_version: "{{ ruby_install_test_version }}"
          canonical_prefix: "{{ ruby_install_test_prefix }}"
          source_sha256: "{{ ruby_install_test_sha256[ruby_install_test_version] }}"
          shared: true
          jit: "{{ {'yjit': false, 'rjit': false} if ruby_install_test_version.startswith('3.4.') else {'yjit': false, 'zjit': false} }}"
          documentation: "{{ ruby_install_test_docs }}"
      ansible.builtin.assert:
        that:
          - (ruby_install_record.content | b64decode | from_json) == ruby_install_expected_record
          - (ruby_install_before.content | b64decode | from_json) == (ruby_install_after.stdout | from_json)
          - (ruby_install_test_rust_before.content | b64decode | from_json) == (ruby_install_test_rust_after.stdout | from_json)
          - ruby_install_workspaces.matched == 0

    - name: Check adding and reusing links on the installed Ruby
      ansible.builtin.include_tasks: tasks/verify_links.yml
      when: ruby_install_test_installer != 'v1.0.0'
      vars:
        ruby_install_version: "{{ ruby_install_test_version }}"
        ruby_install_prefix: "{{ ruby_install_test_prefix }}"
        ruby_install_documentation: "{{ ruby_install_test_docs }}"
        ruby_install_workspace: /var/tmp/ruby-install-link-test-unused

    - name: Check the candidate's response to a version change on the v1.0.0 installation
      ansible.builtin.include_tasks: tasks/verify_version_mismatch.yml
      when: ruby_install_test_installer == 'v1.0.0'
      vars:
        ruby_install_test_requested_version: "3.4.13"

    - name: Save this condition's observations for the CI artifacts
      vars:
        ruby_install_test_result:
          commit: "{{ lookup('ansible.builtin.env', 'RUBY_INSTALL_TEST_COMMIT') }}"
          condition: "{{ ruby_install_test_condition }}"
          record: "{{ ruby_install_record.content | b64decode | from_json }}"
          runtime: "{{ ruby_install_test_runtime.stdout | from_json }}"
          os_ruby: "{{ ruby_install_test_os_ruby.stdout | default('null') | from_json }}"
          rust_before: "{{ ruby_install_test_rust_before.content | b64decode | from_json }}"
          rust_after: "{{ ruby_install_test_rust_after.stdout | from_json }}"
          after_install: "{{ ruby_install_before.content | b64decode | from_json }}"
          after_reruns: "{{ ruby_install_after.stdout | from_json }}"
          workspaces_after_reruns: "{{ ruby_install_workspaces.matched }}"
          installation_role: "{{ ruby_install_test_installer }}"
          publication: "{{ ruby_install_test_link_result | default(none) }}"
          version_mismatch: "{{ ruby_install_test_mismatch | default(none) }}"
      ansible.builtin.copy:
        dest: /var/tmp/ruby-install-case.json
        content: "{{ ruby_install_test_result | to_nice_json }}\n"
        mode: "0600"
