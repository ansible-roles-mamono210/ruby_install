---
driver:
  name: docker
platforms:
  - name: ruby-install-preflight
    image: ${MOLECULE_IMAGE}
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: "$HOME/.ansible/roles/:/tmp"
verifier:
  name: ansible
scenario:
  test_sequence:
    - syntax
    - create
    - converge
    - destroy
